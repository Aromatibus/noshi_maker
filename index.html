<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>熨斗メーカー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Antique&family=Hannari&family=Sawarabi+Mincho&family=Shippori+Mincho:wght@400;700&family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@400;700&display=swap"
    rel="stylesheet"
  >
  
  <style>
    :root {
      --bg-color: #eee;
      --panel-color: #fff;
      --accent-color: #ff8000;
      --border-color: #ddd;

      --w-label: 90px;
      --w-main: 700px;
      --w-size: 200px;
      --w-pos-y: 200px;
      --w-pos-x: 200px;

      /* 画面表示用の倍率設定 */
      --display-scale: 0.8;
    }

    body {
      margin: 0;
      background: var(--bg-color);
      font-family: sans-serif;
      font-size: 12px;
    }

    /* ツールバー設定 */
    #toolbar {
      background: var(--panel-color);
      padding: 5px 25px 10px 25px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-area {
      display: flex;
      align-items: center;
      gap: 15px;
      height: 40px;
      border-bottom: 1px solid #eee;
      margin-bottom: 8px;
    }

    .main-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent-color);
      margin: 0;
    }

    /* 用紙・印刷設定 */
    .header-right-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    .print-settings-label {
      font-size: 11px;
      font-weight: bold;
      color: #666;
    }

    .copyright {
      font-size: 10px;
      color: #999;
    }

    /* 入力行のグリッド設定 */
    .row {
      display: grid;
      grid-template-columns:
        var(--w-label)
        var(--w-main)
        var(--w-size)
        var(--w-pos-y)
        var(--w-pos-x);
      align-items: center;
      min-height: 32px;
      gap: 15px;
      border-bottom: 1px solid #f0f0f0;
      padding: 2px 0;
    }

    .row:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .group-label {
      font-size: 14px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .item-name {
      font-weight: bold;
      font-size: 12px;
    }

    /* プレビュー用紙設定 */
    #paper-container {
      padding: 40px;
      display: flex;
      justify-content: center;
      overflow: auto;
    }

    #paper {
      background: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.15);
      transform: scale(var(--display-scale));
      transform-origin: top center;
    }

    .draggable {
      cursor: move;
      user-select: none;
      touch-action: none;
    }

    .vtext {
      writing-mode: vertical-rl;
      position: absolute;
      white-space: pre;
      line-height: 1.1;
    }

    #canvas_omotegaki { z-index: 100; }
    #canvas_okurinushi { z-index: 80; }
    #noshi_img { z-index: 60; position: absolute; }
    #mizuhiki_img { z-index: 40; position: absolute; }

    /* フォーム要素スタイル */
    input[type="number"] {
      width: 45px;
      height: 24px;
      border: 1px solid #bbb;
      font-size: 13px;
      text-align: center;
    }

    input[type="range"] {
      width: 100px;
      cursor: pointer;
      margin: 0;
    }

    .ok-input {
      width: 100px;
      height: 28px;
      border: 1px solid #bbb;
      font-size: 13px;
      padding: 0 5px;
    }

    select {
      height: 30px;
      border: 1px solid #bbb;
      font-size: 13px;
      padding: 0 8px;
    }

    #ui_om_text {
      width: 120px;
      height: 24px;
      border: 1px solid #bbb;
      font-size: 13px;
    }

    .btn-print {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 6px 25px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
    }

    .btn-sysfont {
      background: #666;
      color: #fff;
      border: none;
      padding: 3px 8px;
      font-size: 10px;
      cursor: pointer;
      border-radius: 3px;
    }

    /* 印刷用設定 */
    @media print {
      @page { 
        size: auto; /* JSで動的に設定 */
        margin: 0; 
      }
      body { background: white; }
      #toolbar { display: none !important; }
      #paper-container { padding: 0; display: block; }
      #paper {
        margin: 0;
        border: none;
        box-shadow: none;
        transform: scale(var(--print-scale, 1.0)) !important;
        transform-origin: top left;
      }
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loaded #loading-overlay {
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
    }
  </style>
</head>
<body>

  <div id="loading-overlay">Webフォント読み込み中...</div>

  <div id="toolbar">
    <div class="header-area">
      <h1 class="main-title">熨斗メーカー</h1>
      <span class="copyright">© 2026 Aromatibus.</span>
      
      <div class="header-right-group">
        <span class="print-settings-label">用紙サイズ:</span>
        <select id="ui_paper_size" style="height: 28px;">
          <option value="297,210">A4 (横)</option>
          <option value="210,297">A4 (縦)</option>
          <option value="420,297">A3 (横)</option>
          <option value="364,257">B4 (横)</option>
          <option value="257,182">B5 (横)</option>
        </select>
        <span class="print-settings-label">印刷倍率:</span>
        <input type="number" id="ui_print_scale" value="100" min="10" max="200" style="height: 24px;">
        <span class="print-settings-label">%</span>
        <button class="btn-print" onclick="window.print()">印 刷</button>
      </div>
    </div>

    <!-- 表書き行 -->
    <div class="row">
      <span class="group-label">表書き</span>
      <div class="group">
        <select id="ui_purpose_sel"></select>
        <input id="ui_om_text" placeholder="内容入力">
        <span class="item-name">書体:</span>
        <select id="ui_font_sel" style="width:130px">
          <optgroup label="筆・楷書系（おすすめ）">
            <option value="'Yuji Syuku', serif">Yuji Syuku (力強い毛筆)</option>
            <option value="'Klee One', sans-serif">Klee One (端正な楷書風)</option>
          </optgroup>
          <optgroup label="明朝体系（上品・高級）">
            <option value="'Shippori Mincho', serif">しっぽり明朝 (非常に優雅)</option>
            <option value="'Sawarabi Mincho', serif">さわらび明朝 (誠実・標準)</option>
            <option value="'Noto Serif JP', serif">Noto Serif JP (現代的・綺麗)</option>
            <option value="'Hannari', serif">Hannari (はんなり明朝)</option>
          </optgroup>
          <optgroup label="システムフォント">
            <option value="'Yu Mincho', '游明朝', serif">游明朝 (標準搭載・最高峰)</option>
            <option value="'MS Mincho', 'MS 明朝', serif">MS 明朝</option>
          </optgroup>
          <optgroup label="その他" id="optgroup_system"></optgroup>
        </select>
        <button class="btn-sysfont" id="btn_manual_font">フォント手入力</button>
        <button class="btn-sysfont" id="btn_load_fonts">システム読込</button>
      </div>
      <div class="group">
        <span class="item-name">サイズ:</span>
        <input type="range" id="ui_om_size_r" min="0" max="800" value="80">
        <input type="number" id="ui_om_size" value="80">
      </div>
      <div class="group">
        <span class="item-name">縦位置</span>
        <input type="range" id="ui_om_y_r" min="-10" max="400" value="20">
        <input type="number" id="ui_om_y" value="20">
      </div>
      <div class="group">
        <span class="item-name">横位置</span>
        <input type="range" id="ui_om_x_r" min="0" max="420" value="136">
        <input type="number" id="ui_om_x" value="136">
      </div>
    </div>

    <!-- 贈り主行 (5名分維持) -->
    <div class="row">
      <span class="group-label">贈り主</span>
      <div class="group">
        <input class="ok-input" placeholder="氏名1">
        <input class="ok-input" placeholder="氏名2">
        <input class="ok-input" placeholder="氏名3">
        <input class="ok-input" placeholder="氏名4">
        <input class="ok-input" placeholder="氏名5">
      </div>
      <div class="group">
        <span class="item-name">サイズ:</span>
        <input type="range" id="ui_ok_size_r" min="0" max="800" value="40">
        <input type="number" id="ui_ok_size" value="40">
      </div>
      <div class="group">
        <span class="item-name">縦位置</span>
        <input type="range" id="ui_ok_y_r" min="-10" max="400" value="110">
        <input type="number" id="ui_ok_y" value="110">
      </div>
      <div class="group">
        <span class="item-name">横位置</span>
        <input type="range" id="ui_ok_x_r" min="0" max="420" value="141">
        <input type="number" id="ui_ok_x" value="141">
      </div>
    </div>

    <!-- 熨斗行 -->
    <div class="row">
      <span class="group-label">熨斗</span>
      <div class="group">
        <select id="ui_noshi_sel" style="width:180px"></select>
      </div>
      <div class="group">
        <span class="item-name">サイズ:</span>
        <input type="range" id="ui_n_w_r" min="5" max="150" value="16">
        <input type="number" id="ui_n_w" value="16">
      </div>
      <div class="group">
        <span class="item-name">縦位置</span>
        <input type="range" id="ui_n_y_r" min="0" max="400" value="10">
        <input type="number" id="ui_n_y" value="10">
      </div>
      <div class="group">
        <span class="item-name">横位置</span>
        <input type="range" id="ui_n_x_r" min="0" max="420" value="175">
        <input type="number" id="ui_n_x" value="175">
      </div>
    </div>

    <!-- 水引行 -->
    <div class="row">
      <span class="group-label">水引</span>
      <div class="group">
        <select id="ui_mizuhiki_sel" style="width:180px"></select>
      </div>
      <div class="group">
        <span class="item-name">サイズ:</span>
        <input type="range" id="ui_m_w_r" min="50" max="1200" value="320">
        <input type="number" id="ui_m_w" value="320">
      </div>
      <div class="group">
        <span class="item-name">縦位置</span>
        <input type="range" id="ui_m_y_r" min="-50" max="400" value="40">
        <input type="number" id="ui_m_y" value="40">
      </div>
      <div class="group">
        <span class="item-name">横位置</span>
        <input type="range" id="ui_m_x_r" min="-200" max="200" value="0">
        <input type="number" id="ui_m_x" value="0">
      </div>
    </div>
  </div>

  <div id="paper-container">
    <div id="paper">
      <img id="mizuhiki_img" class="draggable">
      <img id="noshi_img" class="draggable">
      <div id="canvas_okurinushi" class="vtext draggable"></div>
      <div id="canvas_omotegaki" class="vtext draggable"></div>
    </div>
  </div>

  <script>
    /** 1. 設定データ (すべての項目を完全に保持) **/

    const LIST_PURPOSE = [
      { label: "寿",                          value: "寿" },
      { label: "御祝",                        value: "御祝" },
      { label: "内祝",                        value: "内祝" },
      { label: "御挨拶",                      value: "御挨拶" },
      { label: "御礼",                        value: "御礼" },
      { label: "謝礼（目上の人への御礼）",      value: "謝礼" },
      { label: "寸志（目上から目下の人へ）",    value: "寸志" },
      { label: "粗品（ちょっとした贈り物）",    value: "粗品" },
      { label: "奉納（お祭りなどの感謝）",      value: "奉納" },
      { label: "奉献（地鎮祭・行事など）",      value: "奉献" },
      { label: "御年賀",                      value: "御年賀" },
      { label: "御中元",                      value: "御中元" },
      { label: "御歳暮",                      value: "御歳暮" },
      { label: "暑中御見舞",                  value: "暑中御見舞" },
      { label: "残暑御見舞",                  value: "残暑御見舞" },
      { label: "寒中御見舞",                  value: "寒中御見舞" },
      { label: "〇〇賞",                      value: "〇〇賞" },
      { label: "入学祝",                      value: "祝御入学" },
      { label: "入学祝のお返し",              value: "入学内祝" },
      { label: "卒業祝",                      value: "祝御卒業" },
      { label: "卒業祝のお返し",              value: "卒業内祝" },
      { label: "成人式のお祝い",              value: "祝御成人" },
      { label: "成人祝のお返し",              value: "成人内祝" },
      { label: "父の日",                      value: "父の日御祝" },
      { label: "母の日",                      value: "母の日御祝" },
      { label: "敬老の日",                    value: "敬老の日御祝" },
      { label: "長寿祝：寿福",                value: "寿福" },
      { label: "長寿祝：祝御長寿（丁寧）",    value: "祝御長寿" },
      { label: "長寿祝：賀寿（古希など）",    value: "賀寿" },
      { label: "還暦祝（６０歳）",            value: "祝還暦" },
      { label: "古希祝（７０歳）",            value: "御古希御祝" },
      { label: "喜寿祝（７７歳）",            value: "御喜寿御祝" },
      { label: "傘寿祝（８０歳）",            value: "御傘寿御祝" },
      { label: "米寿祝（８８歳）",            value: "御米寿御祝" },
      { label: "卒寿祝（９０歳）",            value: "御卒寿御祝" },
      { label: "白寿祝（９９歳）",            value: "御白寿御祝" },
      { label: "結婚祝",                      value: "御結婚御祝" },
      { label: "結婚祝のお返し",              value: "内祝" },
      { label: "出産祝",                      value: "御出産御祝" },
      { label: "出産祝のお返し（名入り）",    value: "出産内祝（生まれた子供の名前）" },
      { label: "命名祝",                      value: "祝命名" },
      { label: "命名御礼",                    value: "命名御礼" },
      { label: "新築祝",                      value: "新築御祝" },
      { label: "新築祝のお返し",              value: "新築記念" },
      { label: "開店祝",                      value: "御祝" },
      { label: "引越し挨拶",                  value: "御挨拶" },
      { label: "病気や怪我など",              value: "御見舞" },
      { label: "御見舞のお返し（完治）",      value: "快気祝" },
      { label: "御見舞のお返し（療養）",      value: "快気内祝" },
      { label: "法要供え物（一般）",          value: "御供" },
      { label: "法要供え物（四十九日以降）",  value: "御仏前" },
      { label: "通夜・お葬式",                value: "御霊前" },
      { label: "香典返し",                    value: "偲び草" },
      { label: "法要・香典（主に東日本）",    value: "志" },
      { label: "法要・香典（主に西日本）",    value: "粗供養" }
    ];

    const LIST_NOSHI = [
      { label: "紺",          path: "static/noshi/NOSHI_KON.png" },
      { label: "赤",          path: "static/noshi/NOSHI_RED.png" },
      { label: "なし",        path: "" }
    ];

    const LIST_MIZUHIKI = [
      { label: "花結び赤",    path: "static/mizuhiki/A3_MIZUHIKI_HANAMUSUBI_RED.png" },
      { label: "あわじ赤",    path: "static/mizuhiki/A3_MIZUHIKI_AWAJI_RED.png" },
      { label: "結び切り赤",  path: "static/mizuhiki/A3_MIZUHIKI_MUSUBIKIRI_RED.png" },
      { label: "赤棒",        path: "static/mizuhiki/A3_MIZUHIKI_AKABOU.png" },
      { label: "花結び金",    path: "static/mizuhiki/A3_MIZUHIKI_HANAMUSUBI_GOLD.png" },
      { label: "あわじ金",    path: "static/mizuhiki/A3_MIZUHIKI_AWAJI_GOLD.png" },
      { label: "結び切り金",  path: "static/mizuhiki/A3_MIZUHIKI_MUSUBIKIRI_GOLD.png" },
      { label: "花結び黒",    path: "static/mizuhiki/A3_MIZUHIKI_HANAMUSUBI_BLACK.png" },
      { label: "あわじ黒",    path: "static/mizuhiki/A3_MIZUHIKI_AWAJI_BLACK.png" },
      { label: "結び切り黒",  path: "static/mizuhiki/A3_MIZUHIKI_MUSUBIKIRI_BLACK.png" },
      { label: "なし",        path: "" }
    ];

    const getEl = (id) => document.getElementById(id);

    /** 2. フォント機能 **/
    async function loadSystemFonts() {
      if (!window.queryLocalFonts) {
        alert("ブラウザがAPIに対応していないか、非セキュアな環境です。手入力を使用してください。");
        return;
      }
      try {
        const fonts = await window.queryLocalFonts();
        const group = getEl("optgroup_system");
        group.innerHTML = "";
        const families = Array.from(new Set(fonts.map(f => f.family))).sort();
        families.forEach(f => group.add(new Option(f, f)));
        alert(families.length + "個のフォントを読み込みました。");
      } catch (err) {
        alert("フォントへのアクセスが拒否されました。");
      }
    }

    function addManualFont() {
      const name = prompt("PCに入っているフォント名を入力してください\n(例: MS Mincho, HG行書体, 游明朝)");
      if (name) {
        const group = getEl("optgroup_system");
        const opt = new Option(name, name);
        opt.style.fontFamily = name;
        group.add(opt);
        getEl("ui_font_sel").value = name;
        render();
      }
    }

    /** 3. 初期化処理 **/
    function initSelectors() {
      const pSel = getEl("ui_purpose_sel");
      LIST_PURPOSE.forEach(d => pSel.add(new Option(d.label, d.value)));
      getEl("ui_om_text").value = LIST_PURPOSE[0].value;

      const nSel = getEl("ui_noshi_sel");
      LIST_NOSHI.forEach(d => nSel.add(new Option(d.label, d.path)));

      const mSel = getEl("ui_mizuhiki_sel");
      LIST_MIZUHIKI.forEach(d => mSel.add(new Option(d.label, d.path)));
    }

    /** 4. 同期処理 **/
    function bindSync(rangeId, numId, callback) {
      const r = getEl(rangeId);
      const n = getEl(numId);
      if (!r || !n) return;
      const syncFn = (e) => {
        if (e.target === r) n.value = r.value;
        else r.value = n.value;
        callback();
      };
      r.addEventListener("input", syncFn);
      n.addEventListener("input", syncFn);
    }

    /** 5. 描画処理 **/
    function render() {
      // 5-0. 用紙・印刷設定
      const [wMm, hMm] = getEl("ui_paper_size").value.split(",");
      const paper = getEl("paper");
      paper.style.width = wMm + "mm";
      paper.style.height = hMm + "mm";

      // 印刷用スケール変数のセット
      const printScale = getEl("ui_print_scale").value / 100;
      paper.style.setProperty("--print-scale", printScale);

      const currentFont = getEl("ui_font_sel").value;

      // 5-1. 表書き
      const omView = getEl("canvas_omotegaki");
      omView.textContent = getEl("ui_om_text").value;
      omView.style.left = getEl("ui_om_x").value + "mm";
      omView.style.top = getEl("ui_om_y").value + "mm";
      omView.style.fontSize = getEl("ui_om_size").value + "px";
      omView.style.fontFamily = currentFont;

      // 5-2. 贈り主
      const okView = getEl("canvas_okurinushi");
      const names = Array.from(document.querySelectorAll(".ok-input"))
        .map(i => i.value)
        .filter(v => v);
      okView.textContent = names.join("\n");
      okView.style.left = getEl("ui_ok_x").value + "mm";
      okView.style.top = getEl("ui_ok_y").value + "mm";
      okView.style.fontSize = getEl("ui_ok_size").value + "px";
      okView.style.fontFamily = currentFont;

      // 5-3. 熨斗
      const nImg = getEl("noshi_img");
      const nPath = getEl("ui_noshi_sel").value;
      if (nPath) {
        nImg.src = nPath;
        nImg.style.display = "block";
        nImg.style.left = getEl("ui_n_x").value + "mm";
        nImg.style.top = getEl("ui_n_y").value + "mm";
        nImg.style.width = getEl("ui_n_w").value + "mm";
      } else {
        nImg.style.display = "none";
      }

      // 5-4. 水引
      const mImg = getEl("mizuhiki_img");
      mImg.src = getEl("ui_mizuhiki_sel").value;
      mImg.style.left = `calc(50% + ${getEl("ui_m_x").value}mm)`;
      mImg.style.top = getEl("ui_m_y").value + "mm";
      mImg.style.width = getEl("ui_m_w").value + "mm";
      mImg.style.transform = "translateX(-50%)";
    }

    /** 6. ドラッグ＆ドロップ機能 **/
    function initDragAndDrop() {
      let activeEl = null;
      let startX, startY, startValX, startValY;
      const mmToPx = 3.78; // 1mm = 3.78px (96dpi)

      const onStart = (e) => {
        activeEl = e.target.closest('.draggable');
        if (!activeEl) return;
        
        startX = e.clientX;
        startY = e.clientY;

        let prefix = "";
        if (activeEl.id === "canvas_omotegaki") prefix = "ui_om";
        else if (activeEl.id === "canvas_okurinushi") prefix = "ui_ok";
        else if (activeEl.id === "noshi_img") prefix = "ui_n";
        else if (activeEl.id === "mizuhiki_img") prefix = "ui_m";

        if (prefix) {
          startValX = parseFloat(getEl(prefix + "_x").value);
          startValY = parseFloat(getEl(prefix + "_y").value);
        }
      };

      const onMove = (e) => {
        if (!activeEl) return;
        // プレビューのscale(0.8)を考慮して移動距離を計算
        const dx = (e.clientX - startX) / (mmToPx * 0.8);
        const dy = (e.clientY - startY) / (mmToPx * 0.8);

        let prefix = "";
        if (activeEl.id === "canvas_omotegaki") prefix = "ui_om";
        else if (activeEl.id === "canvas_okurinushi") prefix = "ui_ok";
        else if (activeEl.id === "noshi_img") prefix = "ui_n";
        else if (activeEl.id === "mizuhiki_img") prefix = "ui_m";

        if (prefix) {
          const newX = Math.round(startValX + dx);
          const newY = Math.round(startValY + dy);
          
          getEl(prefix + "_x").value = newX;
          getEl(prefix + "_y").value = newY;
          
          // スライダーも連動
          const rx = getEl(prefix + "_x_r");
          const ry = getEl(prefix + "_y_r");
          if (rx) rx.value = newX;
          if (ry) ry.value = newY;
          
          render();
        }
      };

      const onEnd = () => { activeEl = null; };

      const paper = getEl("paper");
      paper.addEventListener("mousedown", onStart);
      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onEnd);
    }

    /** 7. イベント設定 **/
    function initEvents() {
      getEl("ui_purpose_sel").addEventListener("change", (e) => {
        getEl("ui_om_text").value = e.target.value;
        render();
      });

      getEl("ui_om_text").addEventListener("input", render);
      getEl("ui_font_sel").addEventListener("change", render);
      getEl("ui_noshi_sel").addEventListener("change", render);
      getEl("ui_mizuhiki_sel").addEventListener("change", render);
      getEl("ui_paper_size").addEventListener("change", render);
      getEl("ui_print_scale").addEventListener("input", render);
      
      getEl("btn_load_fonts").addEventListener("click", loadSystemFonts);
      getEl("btn_manual_font").addEventListener("click", addManualFont);

      document.querySelectorAll(".ok-input").forEach(el => {
        el.addEventListener("input", render);
      });

      const syncPairs = [
        ["ui_om_x_r", "ui_om_x"], ["ui_om_y_r", "ui_om_y"], ["ui_om_size_r", "ui_om_size"],
        ["ui_ok_x_r", "ui_ok_x"], ["ui_ok_y_r", "ui_ok_y"], ["ui_ok_size_r", "ui_ok_size"],
        ["ui_n_x_r", "ui_n_x"], ["ui_n_y_r", "ui_n_y"], ["ui_n_w_r", "ui_n_w"],
        ["ui_m_x_r", "ui_m_x"], ["ui_m_y_r", "ui_m_y"], ["ui_m_w_r", "ui_m_w"]
      ];
      syncPairs.forEach(pair => bindSync(pair[0], pair[1], render));
    }

    // 実行
    initSelectors();
    initEvents();
    initDragAndDrop();

    document.fonts.ready.then(() => {
      document.body.classList.add('loaded');
      render();
    });
  </script>

</body>
</html>
